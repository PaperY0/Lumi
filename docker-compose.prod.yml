services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 10000
      SERVE_FRONTEND: "true"
    ports:
      - "8080:10000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:10000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
